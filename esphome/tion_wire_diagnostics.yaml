# Passive byte capture for Tion 3S with the stock BLE proxy. Opt-in per device.
# No dummy receiver: the existing drivers remain the only UART consumers.
logger:
  level: DEBUG
  baud_rate: 0
  tx_buffer_size: 512

uart:
  - id: !extend tion_uart
    debug:
      direction: BOTH
      dummy_receiver: false
      after:
        bytes: 20
        timeout: 10ms
      sequence:
        - lambda: |-
            ESP_LOGD("tion_wire", "UART %s %s",
                     direction == uart::UART_DIRECTION_TX ? "TX" : "RX",
                     format_hex_pretty(bytes).c_str());
  - id: !extend tion_uart_proxy
    debug:
      direction: BOTH
      dummy_receiver: false
      after:
        bytes: 20
        timeout: 10ms
      sequence:
        - lambda: |-
            ESP_LOGD("tion_wire", "BLE %s %s",
                     direction == uart::UART_DIRECTION_TX ? "TX" : "RX",
                     format_hex_pretty(bytes).c_str());
