# Passive byte capture for Tion 3S with the stock BLE proxy. Opt-in per device.
# No dummy receiver: the existing drivers remain the only UART consumers.
esphome:
  min_version: "2026.11.0"

external_components:
  - source: github://dima11235/esphome-tion-ha-lovelace@main
    components: [tion_diagnostics_compat]
    refresh: 0s

tion_diagnostics_compat:

logger:
  level: DEBUG
  baud_rate: 0
  tx_buffer_size: 512

uart:
  - id: !extend tion_uart
    debug:
      direction: BOTH
      dummy_receiver: false
      after:
        bytes: 20
        timeout: 10ms
      sequence:
        - lambda: |-
            char hex[61];
            for (size_t offset = 0; offset < bytes.size(); offset += 20) {
              const size_t length = std::min(size_t(20), bytes.size() - offset);
              format_hex_pretty_to(hex, sizeof(hex), bytes.data() + offset, length, '.');
              ESP_LOGD("tion_wire", "UART %s %s",
                       direction == uart::UART_DIRECTION_TX ? "TX" : "RX", hex);
            }
  - id: !extend tion_uart_proxy
    debug:
      direction: BOTH
      dummy_receiver: false
      after:
        bytes: 20
        timeout: 10ms
      sequence:
        - lambda: |-
            char hex[61];
            for (size_t offset = 0; offset < bytes.size(); offset += 20) {
              const size_t length = std::min(size_t(20), bytes.size() - offset);
              format_hex_pretty_to(hex, sizeof(hex), bytes.data() + offset, length, '.');
              ESP_LOGD("tion_wire", "BLE %s %s",
                       direction == uart::UART_DIRECTION_TX ? "TX" : "RX", hex);
            }
